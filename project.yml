name: Birthdays
options:
  bundleIdPrefix: com.giantrub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: ""
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  Birthdays:
    type: application
    platform: iOS
    sources:
      - Birthdays
    info:
      path: Birthdays/Info.plist
      properties:
        CFBundleDisplayName: Birthdays
        UILaunchScreen: {}
        NSContactsUsageDescription: Birthdays reads the birthdays saved with your contacts so you can import them.
        NSRemindersFullAccessUsageDescription: Used only by the debug seeder to add sample reminders.
        NSCalendarsFullAccessUsageDescription: Birthdays reads birthday events from your calendars so you can import them.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giantrub.Birthdays
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
