name: Birthdays
options:
  bundleIdPrefix: com.giantrub
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.2"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    # Put your Apple Developer Team ID here (Xcode > Settings > Accounts), or pick the team in Xcode.
    DEVELOPMENT_TEAM: 6VZSP98HWY
    CODE_SIGN_STYLE: Automatic
    # Ad-hoc signing keeps the app-group entitlement (shared widget data) working in the simulator.
    "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
targets:
  Birthdays:
    type: application
    platform: iOS
    sources:
      - Birthdays
    # The Home Screen widget needs an App Group, which a free Personal Team cannot have.
    # With a paid Apple Developer account, add these back to get the widget:
    #   dependencies:
    #     - target: BirthdaysWidget
    #       embed: true
    #   entitlements:
    #     path: Birthdays/Birthdays.entitlements
    #     properties:
    #       com.apple.security.application-groups:
    #         - group.com.giantrub.Birthdays
    info:
      path: Birthdays/Info.plist
      properties:
        CFBundleDisplayName: Birthdays
        UILaunchScreen: {}
        NSContactsUsageDescription: Birthdays reads the birthdays saved with your contacts so you can import them.
        NSCalendarsFullAccessUsageDescription: Birthdays reads birthday events from your calendars so you can import them.
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giantrub.Birthdays
        GENERATE_INFOPLIST_FILE: "NO"
        ENABLE_PREVIEWS: "YES"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1"
  BirthdaysWidget:
    type: app-extension
    platform: iOS
    sources:
      - BirthdaysWidget
      - Birthdays/Model/Birthday.swift
      - Birthdays/Model/SharedStore.swift
    info:
      path: BirthdaysWidget/Info.plist
      properties:
        CFBundleDisplayName: Birthdays
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    entitlements:
      path: BirthdaysWidget/BirthdaysWidget.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.giantrub.Birthdays
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.giantrub.Birthdays.widget
        GENERATE_INFOPLIST_FILE: "NO"
        SKIP_INSTALL: "YES"
        TARGETED_DEVICE_FAMILY: "1"
